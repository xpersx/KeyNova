name: KeyNova Premium Polish
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  polish:
    if: "!contains(github.event.head_commit.message, 'KeyNova Premium Polish')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply premium polish
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          s = index.read_text(encoding='utf-8')
          old_footer = '''        <p>\n            © 2026 KeyNova. Todos los derechos reservados.\n        </p>'''
          new_footer = '''        <p class="keynova-legal">\n            © 2026 KeyNova. Todos los derechos reservados.\n            <span>KeyNova™ y sus elementos de marca son propiedad de sus respectivos titulares.</span>\n            <span>Queda prohibida la reproducción, copia o uso no autorizado de los contenidos y elementos distintivos de este sitio.</span>\n        </p>'''
          if old_footer in s:
              s = s.replace(old_footer, new_footer, 1)

          discord = '''\n\n        <button\n            class="discord-button"\n            onclick="sendOrder()"\n        >\n            <span>📩</span>\n            Enviar pedido\n        </button>'''
          s = s.replace(discord, '', 1)
          index.write_text(s, encoding='utf-8')

          js = Path('enhancements.js')
          j = js.read_text(encoding='utf-8')
          j = j.replace('whatsapp: ""', 'whatsapp: "0981101365"', 1)
          js.write_text(j, encoding='utf-8')

          css = Path('enhancements.css')
          c = css.read_text(encoding='utf-8')
          premium = '''\n\n/* ============================================================\n   KEYNOVA — IDENTIDAD PREMIUM + MICROINTERACCIONES\n============================================================ */\n.logo-icon {\n    position: relative;\n    overflow: hidden;\n    border-radius: 16px !important;\n    background: linear-gradient(145deg, #3b82f6 0%, #2563eb 55%, #1d4ed8 100%) !important;\n    box-shadow: 0 10px 30px rgba(37,99,235,.28), inset 0 1px 0 rgba(255,255,255,.24) !important;\n    transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s ease !important;\n}\n.logo-icon::before {\n    content: "";\n    position: absolute;\n    width: 140%;\n    height: 140%;\n    top: -75%;\n    left: -20%;\n    background: linear-gradient(120deg, transparent 38%, rgba(255,255,255,.22) 50%, transparent 62%);\n    transform: translateX(-70%) rotate(12deg);\n    transition: transform .7s ease;\n}\n.logo-icon:hover { transform: translateY(-2px) rotate(-2deg) scale(1.035); box-shadow: 0 16px 38px rgba(37,99,235,.38), inset 0 1px 0 rgba(255,255,255,.3) !important; }\n.logo-icon:hover::before { transform: translateX(70%) rotate(12deg); }\n.hero-content > * { animation: knPremiumIn .75s both; }\n.hero-content > *:nth-child(2) { animation-delay: .08s; }\n.hero-content > *:nth-child(3) { animation-delay: .16s; }\n.hero-content > *:nth-child(4) { animation-delay: .24s; }\n.hero-content > *:nth-child(5) { animation-delay: .32s; }\n.hero-visual { animation: knVisualIn 1s cubic-bezier(.2,.8,.2,1) both; }\n@keyframes knPremiumIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }\n@keyframes knVisualIn { from { opacity: 0; transform: translateX(24px) scale(.97); } to { opacity: 1; transform: translateX(0) scale(1); } }\n.monitor { animation: knMonitorFloat 5s ease-in-out infinite; }\n@keyframes knMonitorFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }\n.product-card, .benefit-card, .review-form, .rating-box, .kn-how-card { transition: transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s ease, border-color .3s ease; }\n.product-card:hover, .benefit-card:hover, .kn-how-card:hover { transform: translateY(-7px); }\n.product-button, .bundle-button, .primary-button, .secondary-button, .checkout-button, .whatsapp-button, .review-button { transition: transform .22s ease, box-shadow .22s ease, filter .22s ease; }\n.product-button:hover, .bundle-button:hover, .primary-button:hover, .checkout-button:hover, .whatsapp-button:hover, .review-button:hover { transform: translateY(-2px); filter: brightness(1.06); }\n.product-button:active, .bundle-button:active, .primary-button:active, .secondary-button:active, .checkout-button:active, .whatsapp-button:active, .review-button:active { transform: translateY(0) scale(.98); }\n.keynova-legal { max-width: 650px; line-height: 1.6; }\n.keynova-legal span { display: block; margin-top: 3px; color: #64748b; font-size: 9px; }\n.kn-payment-notice { position: relative; overflow: hidden; }\n.kn-payment-notice::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: #3b82f6; }\n@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; } }\n'''
          marker = 'KEYNOVA — IDENTIDAD PREMIUM + MICROINTERACCIONES'
          if marker not in c:
              css.write_text(c + premium, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html enhancements.js enhancements.css
          git diff --cached --quiet || (git commit -m "KeyNova Premium Polish" && git push)
